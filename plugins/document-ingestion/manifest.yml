name: document-ingestion
version: 0.1.0
status: draft
decision: DEC-047
created: 2026-06-12
description: >
  Adaptateur d'ingestion documentaire isole. Convertit les documents entrants
  (PDF, DOCX, XLSX, PPTX, HTML, CSV, JSON, XML, EPUB, ZIP) vers du Markdown
  normalise avec frontmatter TricorderKit, pour alimenter le vault Obsidian et
  le RAG local. Cadre generique : definit COMMENT un document est converti,
  archive et trace ; il n'embarque pas de moteur metier.
loop: "inbox -> convert -> frontmatter -> archive_original -> report (+ quarantine si echec)"
provider: markitdown            # microsoft/markitdown, MIT
contracts:
  output: core/contracts/skill_output.schema.json
config:
  example: config.example.yaml
entrypoints:
  cli: scripts/tk_ingest_document.py
guardrails:
  preserve_original: true              # l'original n'est JAMAIS supprime
  overwrite_existing: false            # pas d'ecrasement silencieux
  restrict_to_input_dir: true
  allow_remote_urls: false             # pas de fetch distant par defaut
  quarantine_on_failure: true
  rollback_env: "TK_MARKITDOWN_ENABLED=false"
risks:
  - conversion incomplete (PDF scanne sans OCR, tableaux complexes)
  - acces involontaire a un chemin hors inbox si entree non controlee
tests:
  - tests/test_tk_ingest_document.py

# Contrat d'entrée — core/contracts/skill_preflight.schema.json (make preflight)

preflight:
  inputs:
    - {name: configuration (input_dir), kind: file, ref: plugins/document-ingestion/config.example.yaml, required: true}
    - {name: document à convertir, kind: arg, ref: input, required: true}
  dependencies:
    - {name: python, kind: command, target: python --version, required: true}
    - {name: markitdown, kind: python_module, target: markitdown, required: true}
  env:
    - {name: TK_MARKITDOWN_ENABLED, required: false, secret: false, reason: "false coupe le convertisseur (retour arrière)"}
  stop_conditions:
    - chemin d'entrée hors input_dir
    - URL distante en entrée (allow_remote_urls false)
    - fichier cible déjà présent (pas d'écrasement)
    - conversion en échec (passage en quarantaine)
  retry: {max_attempts: 2}
  rollback:
    strategy: env_flag
    procedure: >
      TK_MARKITDOWN_ENABLED=false désactive le convertisseur. Les originaux sont
      toujours conservés (preserve_original) et rien n'est écrasé.
  escalation:
    risk_level: LOW
    ask_before:
      - activer allow_remote_urls
      - changer input_dir
