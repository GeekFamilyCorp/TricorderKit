name: eval-lab
version: "0.1.0"
description: "Plugin non-régression et validation contrat output — évalue chaque skill contre skill_output.schema.json"
service: tricorderkit-core
language: python
entrypoint: eval_runner.py
token_budget: 400
cache:
  backend: sqlite
  ttl_seconds: 86400
  path: .cache/eval-lab.db
dry_run: true
output_format: json
output_schema: core/contracts/skill_output.schema.json
safe_commands:
  - eval
  - validate-schema
  - report
  - dry-run
priority: HIGH

eval:
  schema_path: core/contracts/skill_output.schema.json
  baseline_db: data/eval-lab/baselines.sqlite
  reports_dir: reports/eval-lab/
  fixture_dir: plugins/eval-lab/fixtures/
  severity_exit_codes:
    CRITICAL: 2
    HIGH: 1
    MEDIUM: 0
    LOW: 0
  auto_update_baseline: false
  skills_registry: plugins/cli-forge/registry.yml

# Contrat d'entrée — core/contracts/skill_preflight.schema.json (make preflight)

preflight:
  inputs:
    - {name: contrat de sortie, kind: file, ref: core/contracts/skill_output.schema.json, required: true}
    - {name: registre des CLIs, kind: file, ref: plugins/cli-forge/registry.yml, required: true}
    - {name: jeux de test, kind: dir, ref: plugins/eval-lab/fixtures, required: true}
  dependencies:
    - {name: python, kind: command, target: python --version, required: true}
    - {name: jsonschema, kind: python_module, target: jsonschema, required: true}
  env: []
  stop_conditions:
    - schéma de sortie introuvable
    - résultat CRITICAL (code de sortie 2)
  retry: {max_attempts: 1}
  rollback:
    strategy: none_read_only
    procedure: >
      Évaluation et rapports uniquement. auto_update_baseline est false :
      la référence n'est jamais réécrite automatiquement.
  escalation:
    risk_level: LOW
    ask_before:
      - mettre à jour la baseline
