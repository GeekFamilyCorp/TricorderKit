[pytest]
# R36 : pas de --basetemp dans le dépôt (.pytest_tmp verrouillé sous Windows).
# pytest utilise le dossier temporaire système et n'y garde que les 3 derniers passages.
addopts = -ra --import-mode=importlib
testpaths = tests plugins skills
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live: Tests nécessitant une connexion réseau réelle (Langfuse, MangaDex, Jikan, AniList)
